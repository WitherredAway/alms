{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% macro body() %}
<div class="text-center py-5">
  <div class="display-4 fw-bold text-secondary">{{ code }}</div>
  <h1 class="h4">{{ title }}</h1>
  <p class="text-muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go home</a>
</div>
{% endmacro %}
{% block content %}{{ body() }}{% endblock %}
{% block public %}<div class="container">{{ body() }}</div>{% endblock %}
